<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnet d'erreurs — Naturalisation</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1c2330; --muted: #677086;
    --line: #dfe3ea; --accent: #2447b8; --accent-soft: #e8edfb;
    --ok: #17794a; --ok-soft: #e4f5ec; --danger: #b3261e; --bad-soft: #fdeceb; --warn-soft: #fff4d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b2029; --text: #e8ebf1; --muted: #98a1b3;
      --line: #2c3340; --accent: #8fa8ff; --accent-soft: #232c47;
      --ok: #6fd3a0; --ok-soft: #173326; --danger: #ff8a80; --bad-soft: #3a1d1b; --warn-soft: #3a3115;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 80px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 1.5rem; margin: 0; }
  .stats { color: var(--muted); font-size: .95rem; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px; margin-top: 16px;
  }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }

  /* ----- formulaire ----- */
  .drop {
    border: 2px dashed var(--line); border-radius: 10px; padding: 22px 14px;
    text-align: center; color: var(--muted); cursor: pointer; transition: .15s;
  }
  .drop:hover, .drop.over, .drop:focus-visible { border-color: var(--accent); background: var(--accent-soft); outline: none; }
  .drop strong { color: var(--text); }
  .drop kbd {
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px;
    padding: 0 6px; font: inherit; font-size: .9em; background: var(--bg);
  }
  .preview { position: relative; margin-top: 4px; }
  .preview img { display: block; max-width: 100%; max-height: 380px; margin: 0 auto; border-radius: 8px; border: 1px solid var(--line); }
  .preview button { position: absolute; top: 8px; right: 8px; }
  label { display: block; font-weight: 600; font-size: .9rem; margin: 14px 0 4px; }
  label span { font-weight: 400; color: var(--muted); }
  textarea, input[type=text], input[type=search] {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--text); font: inherit; resize: vertical;
  }
  textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .actions { display: flex; gap: 8px; margin-top: 16px; align-items: center; flex-wrap: wrap; }
  button {
    font: inherit; font-size: .92rem; padding: 7px 13px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--card); font-weight: 600; padding: 9px 18px; }
  button.danger:hover { border-color: var(--danger); color: var(--danger); }
  .msg { font-size: .9rem; color: var(--danger); }

  /* ----- barre de filtres ----- */
  .bar { display: flex; gap: 8px; margin-top: 28px; flex-wrap: wrap; align-items: center; }
  .bar input[type=search] { flex: 1 1 200px; background: var(--card); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; }
  .seg button.on, button.toggle.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  button.toggle.on { border-color: var(--accent); }

  /* ----- fiches ----- */
  .item.mastered { opacity: .72; }
  .meta { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: .85rem; flex-wrap: wrap; }
  .chip { background: var(--accent-soft); color: var(--accent); border-radius: 99px; padding: 1px 10px; font-weight: 600; }
  .chip.ok { background: var(--ok-soft); color: var(--ok); }
  .item .shot { display: block; max-width: 100%; max-height: 460px; margin: 12px auto 0; border-radius: 8px; border: 1px solid var(--line); cursor: zoom-in; }
  .q { font-size: 1.08rem; font-weight: 600; margin: 12px 0 0; white-space: pre-wrap; }
  .block { margin-top: 12px; padding: 10px 12px; border-radius: 8px; white-space: pre-wrap; }
  .block b { display: block; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
  .ans { background: var(--ok-soft); border-left: 4px solid var(--ok); }
  .ans b { color: var(--ok); }
  .exp { background: var(--warn-soft); border-left: 4px solid #d9a400; }
  .exp b { color: var(--muted); }
  .opts { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
  .opts li { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; }
  .opts em { font-style: normal; font-size: .8rem; font-weight: 700; white-space: nowrap; }
  .opts .good { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 600; }
  .opts .bad { background: var(--bad-soft); border-color: var(--danger); color: var(--danger); }
  .opts .bad span { text-decoration: line-through; }
  .opts.masked li { background: none; border-color: var(--line); color: inherit; font-weight: 400; }
  .opts.masked span { text-decoration: none; }
  .opts.masked em { display: none; }
  .mine { background: var(--bad-soft); border-left: 4px solid var(--danger); }
  .mine b { color: var(--danger); }
  .mine span { text-decoration: line-through; }
  .key { background: var(--accent-soft); border-left: 4px solid var(--accent); font-weight: 600; }
  .key b { color: var(--accent); }
  .busy { display: flex; gap: 10px; align-items: center; justify-content: center; padding: 26px 14px; color: var(--muted); }
  .spin { width: 18px; height: 18px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg:empty { display: none; }
  .msg { margin: 10px 0 0; text-align: center; }
  select { font: inherit; font-size: .92rem; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); max-width: 100%; }
  .item textarea { margin-top: 2px; background: var(--card); }
  .item label { margin-top: 10px; }
  .link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; font-size: .85rem; }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; }
  .zoom {
    position: fixed; inset: 0; background: rgba(0,0,0,.85); display: flex;
    align-items: center; justify-content: center; cursor: zoom-out; padding: 16px; z-index: 10;
  }
  .zoom img { max-width: 100%; max-height: 100%; border-radius: 6px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Carnet d'erreurs · Naturalisation</h1>
    <div class="stats" id="stats"></div>
  </header>

  <section class="card" id="import">
    <div class="drop" id="drop" tabindex="0" role="button">
      <strong>Colle la capture de ta question ratée avec <kbd>Ctrl</kbd> + <kbd>V</kbd></strong><br>
      ou glisse une image ici, ou clique pour choisir un fichier
    </div>
    <div class="busy" id="busy" hidden><span class="spin"></span><span id="busyText"></span></div>
    <p class="msg" id="msg"></p>
    <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
  </section>

  <div class="bar">
    <input type="search" id="search" placeholder="Rechercher…">
    <select id="themeFilter" aria-label="Thème"></select>
    <div class="seg" id="filter">
      <button type="button" data-f="todo" class="on">À revoir</button>
      <button type="button" data-f="done">Maîtrisées</button>
      <button type="button" data-f="all">Toutes</button>
    </div>
    <button type="button" class="toggle" id="quiz" title="Cache les réponses pour t'auto-tester">Mode révision</button>
  </div>

  <div id="list"></div>
</main>

<script>
const $ = id => document.getElementById(id);
const FIELDS = ['question', 'options', 'answer', 'my_answer', 'explanation', 'key_point', 'theme'];
const LABELS = {question: 'Question', options: 'Propositions (une par ligne)', answer: 'Bonne réponse', my_answer: 'Ma réponse (fausse)',
                explanation: 'Explication', key_point: 'À retenir (facultatif)', theme: 'Thème (facultatif)'};
let items = [], filter = 'todo', quiz = false, editingId = null;

async function api(method, url, body) {
  const res = await fetch(url, {
    method, headers: body ? {'Content-Type': 'application/json'} : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Erreur inattendue.');
  return data;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function replaceItem(updated) { items = items.map(i => i.id === updated.id ? updated : i); }

/* ---------- import : coller / glisser / choisir, puis analyse ---------- */
const queue = [];
let working = false;

function addImages(files) {
  const images = [...files].filter(f => f.type.startsWith('image/'));
  if (!images.length) return;
  queue.push(...images);
  if (!working) processQueue();
}
const readAsDataURL = file => new Promise((resolve, reject) => {
  const r = new FileReader();
  r.onload = () => resolve(r.result); r.onerror = reject;
  r.readAsDataURL(file);
});
async function processQueue() {
  working = true;
  $('msg').textContent = '';
  $('drop').hidden = true; $('busy').hidden = false;
  const errors = [];
  while (queue.length) {
    $('busyText').textContent = 'Lecture de la capture…' + (queue.length > 1 ? ` (encore ${queue.length})` : '');
    try {
      items.unshift(await api('POST', '/api/erreurs', {image: await readAsDataURL(queue.shift())}));
      render();
    } catch (err) { errors.push(err.message); }
  }
  $('msg').textContent = [...new Set(errors)].join(' ');
  $('drop').hidden = false; $('busy').hidden = true;
  working = false;
}

document.addEventListener('paste', e => {
  if (e.clipboardData.files.length) { e.preventDefault(); addImages(e.clipboardData.files); }
});
const drop = $('drop');
drop.onclick = () => $('file').click();
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } };
$('file').onchange = e => { addImages(e.target.files); e.target.value = ''; };
['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
document.addEventListener('drop', e => addImages(e.dataTransfer.files));

/* ---------- liste ---------- */
function render() {
  const todo = items.filter(i => !i.mastered).length;
  $('stats').textContent = items.length
    ? `${todo} à revoir · ${items.length - todo} maîtrisée${items.length - todo > 1 ? 's' : ''}`
    : '';

  const sel = $('themeFilter'), current = sel.value;
  const themes = [...new Set(items.map(i => i.theme).filter(Boolean))].sort();
  sel.replaceChildren(new Option('Tous les thèmes', ''), ...themes.map(t => new Option(t, t)));
  sel.value = themes.includes(current) ? current : '';
  sel.hidden = themes.length < 2;

  const q = $('search').value.trim().toLowerCase();
  const shown = items.filter(i =>
    (filter === 'all' || (filter === 'done') === !!i.mastered) &&
    (!sel.value || i.theme === sel.value) &&
    (!q || FIELDS.some(f => i[f].toLowerCase().includes(q))));

  const list = $('list');
  list.replaceChildren();
  if (!shown.length) {
    list.append(el('div', 'empty', items.length
      ? 'Aucune fiche ne correspond à ce filtre.'
      : 'Aucune fiche pour l\'instant. Colle ta première capture ci-dessus.'));
    return;
  }
  shown.forEach(item => list.append(item.id === editingId ? editCard(item) : card(item)));
}

function block(cls, label, text) {
  const b = el('div', 'block ' + cls);
  b.append(el('b', '', label), el('span', '', text));
  return b;
}

function card(item) {
  const c = el('article', 'card item' + (item.mastered ? ' mastered' : ''));

  const meta = el('div', 'meta');
  if (item.theme) meta.append(el('span', 'chip', item.theme));
  if (item.mastered) meta.append(el('span', 'chip ok', '✓ Maîtrisée'));
  meta.append(el('span', '', 'Ajoutée le ' + new Date(item.created_at).toLocaleDateString('fr-FR',
    {day: 'numeric', month: 'long', year: 'numeric'})));
  if (item.image) {
    const see = el('button', 'link', 'Voir la capture');
    see.onclick = () => zoom('/images/' + item.image);
    meta.append(see);
  }
  c.append(meta, el('p', 'q', item.question));

  // Les propositions sont toujours visibles ; en mode révision, leurs couleurs
  // et tout ce qui suit restent masqués jusqu'au clic.
  const secret = [];
  const options = item.options ? item.options.split('\n').filter(Boolean) : [];
  const same = (a, b) => a.trim().toLowerCase() === b.trim().toLowerCase();
  let list = null;
  if (options.length) {
    list = el('ul', 'opts');
    options.forEach(o => {
      const li = el('li', same(o, item.answer) ? 'good' : same(o, item.my_answer) ? 'bad' : '');
      li.append(el('span', '', o));
      if (li.className === 'good') li.append(el('em', '', '✓ Bonne réponse'));
      if (li.className === 'bad') li.append(el('em', '', '✗ Ma réponse'));
      list.append(li);
    });
    c.append(list);
  }
  const listed = t => options.some(o => same(o, t));
  if (item.my_answer && !listed(item.my_answer)) secret.push(block('mine', 'Ma réponse', item.my_answer));
  if (item.answer && !listed(item.answer)) secret.push(block('ans', 'Bonne réponse', item.answer));
  if (item.explanation) secret.push(block('exp', 'Explication', item.explanation));
  if (item.key_point) secret.push(block('key', 'À retenir', item.key_point));
  c.append(...secret);

  const actions = el('div', 'actions');
  if (quiz && (secret.length || list)) {
    secret.forEach(s => s.hidden = true);
    list?.classList.add('masked');
    const reveal = el('button', 'primary', 'Voir la réponse');
    reveal.onclick = () => { secret.forEach(s => s.hidden = false); list?.classList.remove('masked'); reveal.remove(); };
    actions.append(reveal);
  }
  const done = el('button', '', item.mastered ? '↺ À revoir' : '✓ Je la maîtrise');
  done.onclick = async () => {
    replaceItem(await api('PUT', '/api/erreurs/' + item.id, {mastered: !item.mastered}));
    render();
  };
  const edit = el('button', '', 'Corriger');
  edit.onclick = () => { editingId = item.id; render(); };
  const del = el('button', 'danger', 'Supprimer');
  del.onclick = async () => {
    if (!confirm('Supprimer définitivement cette fiche ?')) return;
    await api('DELETE', '/api/erreurs/' + item.id);
    items = items.filter(i => i.id !== item.id);
    render();
  };
  actions.append(done, edit, del);
  c.append(actions);
  return c;
}

// Fiche en mode correction : au cas où la lecture de l'image s'est trompée.
function editCard(item) {
  const c = el('article', 'card item');
  const inputs = {};
  FIELDS.forEach(f => {
    const label = el('label', '', LABELS[f]);
    const input = f === 'theme' ? el('input') : el('textarea');
    if (f === 'theme') input.type = 'text';
    else input.rows = f === 'explanation' || f === 'options' ? 4 : 2;
    input.value = item[f];
    inputs[f] = input;
    label.append(input);
    c.append(label);
  });
  const actions = el('div', 'actions');
  const save = el('button', 'primary', 'Enregistrer');
  save.onclick = async () => {
    replaceItem(await api('PUT', '/api/erreurs/' + item.id,
      Object.fromEntries(FIELDS.map(f => [f, inputs[f].value]))));
    editingId = null; render();
  };
  const cancel = el('button', '', 'Annuler');
  cancel.onclick = () => { editingId = null; render(); };
  actions.append(save, cancel);
  c.append(actions);
  return c;
}

function zoom(src) {
  const z = el('div', 'zoom');
  const i = el('img'); i.src = src; i.alt = 'Capture d\'origine';
  z.append(i);
  z.onclick = () => z.remove();
  document.body.append(z);
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelector('.zoom')?.remove();
});

$('search').oninput = render;
$('themeFilter').onchange = render;
$('filter').onclick = e => {
  if (!e.target.dataset.f) return;
  filter = e.target.dataset.f;
  [...$('filter').children].forEach(b => b.classList.toggle('on', b === e.target));
  render();
};
$('quiz').onclick = () => { quiz = !quiz; $('quiz').classList.toggle('on', quiz); render(); };

api('GET', '/api/erreurs').then(data => { items = data; render(); });
</script>
</body>
</html>
